name: CI

# O portão antes do merge. Roda em todo push e em toda PR, e os dois lados são
# independentes: erro no front não esconde erro no back, e vice-versa.
on:
  push:
  pull_request:

permissions:
  contents: read

# Push novo na mesma branch cancela a execução anterior — CI de commit já
# substituído só gasta minuto e atrasa a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (typecheck · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci (e não npm install): respeita o lockfile e falha se ele estiver
      # fora de sincronia com o package.json, em vez de resolver sozinho uma
      # árvore diferente da que roda em produção.
      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

  frontend:
    name: frontend (typecheck · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Valor público e só de build — o bundle do navegador não carrega
          # segredo nenhum. A URL real entra no build do EasyPanel.
          NEXT_PUBLIC_API_URL: http://localhost:3010/api/v1

      - name: Testes
        run: npm test --if-present

  # Builda as duas imagens exatamente como o EasyPanel vai buildar: contexto na
  # raiz, Dockerfile apontado por -f. Sem isto, um erro de Dockerfile só
  # aparece no deploy — e aí já está no caminho crítico. Não faz push: o
  # objetivo é falhar aqui, e não lá.
  imagens:
    name: imagens docker (build de verificação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Imagem da web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          build-args: |
            NEXT_PUBLIC_API_URL=https://api.cast.dmsregem.com/api/v1
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
