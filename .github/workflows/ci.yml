name: CI

# O portão antes do merge. Roda em toda PR e na `main` depois do merge, e os
# dois lados são independentes: erro no front não esconde erro no back, e
# vice-versa.
#
# Push em branch de PR NÃO dispara de novo: com `push` sem filtro, cada commit
# de uma PR rodava duas vezes (o push e a PR, em grupos de concorrência
# diferentes) e esgotou a cota de minutos do repositório privado em 29/09/2026.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Push novo na mesma branch cancela a execução anterior — CI de commit já
# substituído só gasta minuto e atrasa a fila.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# A versão EXATA do Node, num lugar só: o CI testa com ela e confere que as duas
# imagens (backend/Dockerfile e frontend/Dockerfile, que fixam a mesma tag)
# respondem a mesma em `node -v`. "22" solto pegava a versão que estivesse
# guardada no executor — e o boletim de 21/10/2026 (Brotli, CVE-2026-111497)
# só está corrigido a partir da 22.23.4.
env:
  NODE_VERSAO: '22.23.4'

jobs:
  backend:
    name: backend (typecheck · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSAO }}
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Versão do Node
        run: test "$(node -v)" = "v${NODE_VERSAO}" && node -v

      # npm ci (e não npm install): respeita o lockfile e falha se ele estiver
      # fora de sincronia com o package.json, em vez de resolver sozinho uma
      # árvore diferente da que roda em produção.
      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Testes
        run: npm test

  frontend:
    name: frontend (typecheck · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSAO }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Versão do Node
        run: test "$(node -v)" = "v${NODE_VERSAO}" && node -v

      - name: Instalar dependências
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Valor público e só de build — o bundle do navegador não carrega
          # segredo nenhum. A URL real entra no build do EasyPanel.
          API_URL_PUBLICA: http://localhost:3010/api/v1

      - name: Testes
        run: npm test --if-present

  # Builda as duas imagens exatamente como o EasyPanel vai buildar: contexto na
  # raiz, Dockerfile apontado por -f. Sem isto, um erro de Dockerfile só
  # aparece no deploy — e aí já está no caminho crítico. Não faz push: o
  # objetivo é falhar aqui, e não lá.
  imagens:
    name: imagens docker (build de verificação)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Imagem da API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: backend/Dockerfile
          push: false
          load: true
          tags: regemcast-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Imagem da web
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false
          load: true
          tags: regemcast-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      # O Node que sobe em produção é o da imagem, não o do setup-node: confere
      # dentro das duas imagens que é a versão fixada lá em cima (Dockerfile e
      # CI divergindo deixam o CI vermelho).
      - name: Versão do Node nas imagens
        run: |
          for imagem in regemcast-api:ci regemcast-web:ci; do
            versao="$(docker run --rm --entrypoint node "$imagem" -v)"
            echo "$imagem: $versao"
            test "$versao" = "v${NODE_VERSAO}"
          done

  app:
    name: app Android (análise · testes)
    runs-on: ubuntu-latest
    # O filtro de caminhos lista os arquivos da PR pela API do GitHub.
    permissions:
      contents: read
      pull-requests: read
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      # Só roda o Flutter quando o app mudou: a instalação custa minutos, e
      # a maioria das PRs é de backend ou web.
      - uses: dorny/paths-filter@v3
        id: mudou
        with:
          filters: |
            app:
              - 'app/**'
              - '.github/workflows/ci.yml'

      # A mesma versão da máquina de build: análise e testes que passam aqui
      # passam lá, e vice-versa.
      - uses: subosito/flutter-action@v2
        if: steps.mudou.outputs.app == 'true'
        with:
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Dependências
        if: steps.mudou.outputs.app == 'true'
        run: flutter pub get

      - name: Análise
        if: steps.mudou.outputs.app == 'true'
        run: flutter analyze

      - name: Testes
        if: steps.mudou.outputs.app == 'true'
        run: flutter test
